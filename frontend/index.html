<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#2b7fff" />

    <!-- Primary SEO -->
    <title>QuizMind AI - Personalized AI Quiz Generator</title>

    <meta
      name="description"
      content="QuizMind AI is a personalized AI quiz generator that creates quizzes, adapts difficulty to your skill level, and provides actionable learning insights."
    />

    <meta
      name="keywords"
      content="QuizMind AI, AI quiz generator, AI quiz maker, personalized quiz generator, AI question generator, AI MCQ generator"
    />

    <meta name="author" content="QuizMind AI" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.quizmindai.live/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.quizmindai.live/" />
    <meta
      property="og:title"
      content="QuizMind AI - Personalized AI Quiz Generator"
    />
    <meta
      property="og:description"
      content="Generate personalized AI quizzes, adapt difficulty to your skill level, and turn every answer into actionable learning insights."
    />
    <meta
      property="og:image"
      content="https://www.quizmindai.live/og-image.png"
    />
    <meta property="og:site_name" content="QuizMind AI" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="QuizMind AI - Personalized AI Quiz Generator"
    />
    <meta
      name="twitter:description"
      content="Generate personalized quizzes with AI and improve your learning with adaptive assessments."
    />
    <meta
      name="twitter:image"
      content="https://www.quizmindai.live/og-image.png"
    />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "QuizMind AI",
        "alternateName": "QuizMind",
        "url": "https://www.quizmindai.live/"
      }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "QuizMind AI",
        "url": "https://www.quizmindai.live/",
        "logo": "https://www.quizmindai.live/favicon.svg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
